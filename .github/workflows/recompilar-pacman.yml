name: Recompilar Pac-Man para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            unzip \
            zip \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxss-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxinerama-dev \
            libxfixes-dev \
            libx11-xcb-dev \
            libc++-21-dev \
            libc++abi-21-dev

      - name: Verificar ambiente
        run: |
          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Clang 21 ==="
          clang-21 --version
          clang++-21 --version

          echo "=== Verificar arquivos obrigatorios ==="
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f default.xex

          echo "default.xex encontrado."

          echo "=== Presets disponiveis ==="
          cmake --list-presets

      - name: Configurar SDK ReXGlue
        run: |
          cmake --preset linux-amd64 \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_C_FLAGS="-march=x86-64-v2" \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2 -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++"

      - name: Compilar e instalar SDK ReXGlue
        run: |
          cmake --build \
            --preset linux-amd64-release \
            --target install

      - name: Localizar executavel ReXGlue
        run: |
          echo "=== Procurando o executavel ==="

          find out -type f -name rexglue \
            -perm /111 -print || true

          if [ -x "out/linux-amd64/Release/rexglue" ]; then
            REXGLUE_BIN="$GITHUB_WORKSPACE/out/linux-amd64/Release/rexglue"
          elif [ -x "out/linux-amd64/rexglue" ]; then
            REXGLUE_BIN="$GITHUB_WORKSPACE/out/linux-amd64/rexglue"
          else
            echo "::error::Executavel rexglue x86-64 nao encontrado em out/linux-amd64."
            echo "Arquivos encontrados:"
            find out/linux-amd64 -type f -name rexglue -print 2>/dev/null || true
            exit 1
          fi

          # Guarde a ferramenta host fora do workspace para que o CMake Android
          # nao possa sobrescreve-la ao compilar o alvo rexglue.
          REXGLUE_BIN="$RUNNER_TEMP/rexglue-host"
          cp "$GITHUB_WORKSPACE/out/linux-amd64/Release/rexglue" "$REXGLUE_BIN" 2>/dev/null || cp "$GITHUB_WORKSPACE/out/linux-amd64/rexglue" "$REXGLUE_BIN"
          chmod +x "$REXGLUE_BIN"
          echo "REXGLUE_BIN=$REXGLUE_BIN" >> "$GITHUB_ENV"

          echo "=== Versao e ajuda do ReXGlue (host x86-64) ==="
          file "$REXGLUE_BIN"
          "$REXGLUE_BIN" --help

      - name: Inicializar projeto Pac-Man
        run: |
          mkdir -p pacman_project

          "$REXGLUE_BIN" init \
            --project-name pacman_colors \
            --xex-path "$GITHUB_WORKSPACE/default.xex" \
            --game-root "$GITHUB_WORKSPACE" \
            --project-root "$GITHUB_WORKSPACE/pacman_project"

      - name: Verificar arquivos gerados
        run: |
          echo "=== Arquivos do projeto ==="
          find pacman_project -maxdepth 4 -type f -print | sort

          echo "=== Arquivos TOML ==="
          find pacman_project -type f -name '*.toml' -print

      - name: Gerar codigo do Pac-Man
        working-directory: pacman_project
        run: |
          CONFIG="$(find . -type f -name '*.toml' \
            ! -path './build*/*' -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "::error::Nenhum arquivo TOML encontrado."
            exit 1
          fi

          echo "Configuracao encontrada: $CONFIG"
          "$REXGLUE_BIN" --force codegen "$CONFIG"

      - name: Corrigir includes e identificador Android no projeto gerado
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cmake_file = Path("pacman_project/CMakeLists.txt")
          if not cmake_file.is_file():
              raise SystemExit("CMakeLists.txt do projeto gerado não foi encontrado")

          text = cmake_file.read_text()
          additions = [
              'target_include_directories(pacman_colors PRIVATE "${REXSDK_DIR}/thirdparty/imgui")',
              'target_compile_definitions(pacman_colors PRIVATE REX_ANDROID_APP_IDENTIFIER="pacman_colors")',
          ]
          anchor = "rexglue_setup_target(pacman_colors)"
          if anchor not in text:
              raise SystemExit("Não encontrei rexglue_setup_target(pacman_colors)")

          # Inserir as duas configurações numa única gravação, sem perder
          # alterações anteriores por reutilizar uma cópia antiga do texto.
          missing = [line for line in additions if line not in text]
          if missing:
              text = text.replace(anchor, "\n".join(missing) + "\n" + anchor, 1)
              cmake_file.write_text(text)

          print("Includes do ImGui e identificador Android verificados.")
          print(cmake_file.read_text())
          PY

      - name: Verificar Android NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "::error::ANDROID_NDK_LATEST_HOME nao esta definido."
            exit 1
          fi

          test -f \
            "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

          echo "Android NDK encontrado."

      - name: Verificar configuracao Android do projeto
        run: |
          if [ ! -f pacman_project/CMakeLists.txt ]; then
            echo "::error::CMakeLists.txt do projeto nao encontrado."
            exit 1
          fi

          echo "=== CMakeLists.txt do projeto ==="
          cat pacman_project/CMakeLists.txt

          echo "=== Referencias a Android e Vulkan ==="
          grep -R -n -i \
            'vulkan\|ANDROID_ABI\|android.toolchain' \
            pacman_project \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            --include='*.mk' || true

      - name: Compilar codigo gerado para Android (ARM64)
        working-directory: pacman_project
        run: |
          echo "=== Configurando o projeto com Android NDK ==="
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXSDK_DIR="$GITHUB_WORKSPACE"

          echo "=== Ajustando somente o comando de codegen ==="
          # Nao altere generated/rexglue.cmake: ele tambem define onde o alvo
          # rexglue e compilado. Altere apenas a receita que EXECUTA o codegen.
          python3 - <<'PY'
          import os
          from pathlib import Path

          host = os.environ["REXGLUE_BIN"]
          candidates = [
              Path("build-android/CMakeFiles/pacman_colors_codegen.dir/build.make"),
              Path("build-android/generated/default/CMakeFiles/pacman_colors_codegen.dir/build.make"),
          ]
          found = False
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text()
              original = text
              for old in (
                  os.environ["GITHUB_WORKSPACE"] + "/out/linux-arm64/rexglue",
                  os.environ["GITHUB_WORKSPACE"] + "/out/linux-amd64/Release/rexglue",
                  os.environ["GITHUB_WORKSPACE"] + "/out/linux-amd64/rexglue",
              ):
                  text = text.replace(old, host)
              if text != original:
                  path.write_text(text)
                  print(f"Codegen atualizado em: {path}")
                  found = True
          if not found:
              print("Nenhuma referencia foi substituida nos caminhos conhecidos; procurando receitas...")
              for path in Path("build-android").rglob("build.make"):
                  text = path.read_text(errors="ignore")
                  if "pacman_colors_codegen" in str(path):
                      print(f"Receita encontrada: {path}")
                      print("\\n".join(line for line in text.splitlines() if "rexglue" in line))
          PY

          CODEGEN_MAKE="build-android/CMakeFiles/pacman_colors_codegen.dir/build.make"
          if [ -f "$CODEGEN_MAKE" ]; then
            grep -n -F "$REXGLUE_BIN" "$CODEGEN_MAKE" || true
          fi

          echo "=== Compilando biblioteca Android ==="
          cmake --build build-android --config Release

      - name: Configurar Java 17 para Gradle Android
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Empacotar APK Android com SDL3
        if: success()
        working-directory: pacman_project
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.4.x https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          mkdir -p android-package
          cp -a "$RUNNER_TEMP/SDL/android-project/." android-package/
          # O projeto Android do SDL deve compilar a biblioteca compartilhada libSDL3.so,
          # que a Activity carrega com System.loadLibrary("SDL3"). Não desabilite
          # externalNativeBuild: isso deixava o APK sem libSDL3.so.
          mkdir -p android-package/app/jni
          cp -a "$RUNNER_TEMP/SDL" android-package/app/jni/SDL

          MAIN_LIB="$(find build-android "$GITHUB_WORKSPACE/out/linux-arm64" -type f -name 'libmain.so' -print -quit 2>/dev/null || true)"
          if [ -z "$MAIN_LIB" ]; then
            echo "::error::A biblioteca libmain.so do Pac-Man não foi gerada."
            find build-android -type f -name '*.so' -print || true
            exit 1
          fi

          # Deixe o Gradle/NDK compilar SDL3 e o alvo de exemplo para produzir
          # libSDL3.so; depois substitua somente libmain.so dentro do APK pelo
          # binário recompilado do ReXGlue.
          sed -i 's/android:label="@string\/app_name"/android:label="Pac-Man Recompiled"/' android-package/app/src/main/AndroidManifest.xml
          cd android-package
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p ../dist/android-apk

          mkdir -p "$RUNNER_TEMP/apk-replace/lib/arm64-v8a"
          cp "$MAIN_LIB" "$RUNNER_TEMP/apk-replace/lib/arm64-v8a/libmain.so"
          (cd "$RUNNER_TEMP/apk-replace" && zip -q -u "$GITHUB_WORKSPACE/pacman_project/android-package/$APK" lib/arm64-v8a/libmain.so)

          cp "$APK" ../dist/android-apk/pacman-android-arm64-debug.apk
          echo "APK criado:"
          ls -lh ../dist/android-apk/pacman-android-arm64-debug.apk
          echo "Bibliotecas ARM64 incluídas:"
          unzip -l ../dist/android-apk/pacman-android-arm64-debug.apk | grep -E 'lib/arm64-v8a/lib(main|SDL3)\.so'
          unzip -l ../dist/android-apk/pacman-android-arm64-debug.apk | grep -q 'lib/arm64-v8a/libSDL3\.so' || { echo "::error::libSDL3.so não foi incluída no APK."; exit 1; }

      - name: Preparar diagnosticos compactos
        if: always()
        run: |
          mkdir -p diagnosticos
          echo "Run: $GITHUB_RUN_ID" > diagnosticos/resumo.txt
          echo "Commit: $GITHUB_SHA" >> diagnosticos/resumo.txt
          if [ -f pacman_project/generated/default/pacman_colors_recomp.205.cpp ]; then
            SOURCE="pacman_project/generated/default/pacman_colors_recomp.205.cpp"
            echo "Arquivo que falhou: $SOURCE" >> diagnosticos/resumo.txt
            grep -n -B 25 -A 25 -F "loc_82AF498C" "$SOURCE" > diagnosticos/erro-label.txt || true
            cp "$SOURCE" diagnosticos/pacman_colors_recomp.205.cpp
          fi
          for file in \
            pacman_project/CMakeLists.txt \
            pacman_project/build-android/CMakeCache.txt \
            pacman_project/build-android/CMakeFiles/pacman_colors_recomp.dir/build.make; do
            if [ -f "$file" ]; then
              cp --parents "$file" diagnosticos/
            fi
          done
          find diagnosticos -type f -printf '%p %s bytes\\n' >> diagnosticos/resumo.txt

      - name: Salvar diagnosticos compactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pacman
          path: diagnosticos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar APK Android
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pacman-android-apk
          path: pacman_project/dist/android-apk/pacman-android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
