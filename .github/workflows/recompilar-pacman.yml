name: Recompilar Pac-Man para Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            unzip \
            zip \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Verificar ambiente
        run: |
          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Clang 21 ==="
          clang-21 --version
          clang++-21 --version

          echo "=== Verificar arquivos obrigatorios ==="
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f default.xex

          echo "default.xex encontrado."

          echo "=== Presets disponiveis ==="
          cmake --list-presets

      - name: Configurar SDK ReXGlue
        run: |
          cmake --preset linux-amd64 \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21

      - name: Compilar e instalar SDK ReXGlue
        run: |
          cmake --build \
            --preset linux-amd64-release \
            --target install

      - name: Localizar executavel ReXGlue
        run: |
          echo "=== Procurando o executavel ==="

          find out -type f -name rexglue \
            -perm /111 -print || true

          if [ -x "out/linux-amd64/Release/rexglue" ]; then
            REXGLUE_BIN="$GITHUB_WORKSPACE/out/linux-amd64/Release/rexglue"
          elif [ -x "out/linux-amd64/rexglue" ]; then
            REXGLUE_BIN="$GITHUB_WORKSPACE/out/linux-amd64/rexglue"
          else
            REXGLUE_REL="$(find out -type f \
              -name rexglue -perm /111 \
              -print -quit 2>/dev/null || true)"

            if [ -z "$REXGLUE_REL" ]; then
              echo "::error::Executavel rexglue nao encontrado."
              exit 1
            fi

            REXGLUE_BIN="$GITHUB_WORKSPACE/$REXGLUE_REL"
          fi

          echo "REXGLUE_BIN=$REXGLUE_BIN" >> "$GITHUB_ENV"

          echo "=== Versao e ajuda do ReXGlue ==="
          "$REXGLUE_BIN" --help

      - name: Inicializar projeto Pac-Man
        run: |
          mkdir -p pacman_project

          "$REXGLUE_BIN" init \
            --project-name pacman_colors \
            --xex-path "$GITHUB_WORKSPACE/default.xex" \
            --game-root "$GITHUB_WORKSPACE" \
            --project-root "$GITHUB_WORKSPACE/pacman_project"

      - name: Verificar arquivos gerados
        run: |
          echo "=== Arquivos do projeto ==="
          find pacman_project -maxdepth 4 -type f -print | sort

          echo "=== Arquivos TOML ==="
          find pacman_project -type f -name '*.toml' -print

      - name: Gerar codigo do Pac-Man
        working-directory: pacman_project
        run: |
          CONFIG="$(find . -type f -name '*.toml' \
            ! -path './build*/*' -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "::error::Nenhum arquivo TOML encontrado."
            exit 1
          fi

          echo "Configuracao encontrada: $CONFIG"
          "$REXGLUE_BIN" codegen "$CONFIG"

      - name: Verificar Android NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "::error::ANDROID_NDK_LATEST_HOME nao esta definido."
            exit 1
          fi

          test -f \
            "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

          echo "Android NDK encontrado."

      - name: Verificar configuracao Android do projeto
        run: |
          if [ ! -f pacman_project/CMakeLists.txt ]; then
            echo "::error::CMakeLists.txt do projeto nao encontrado."
            exit 1
          fi

          echo "=== CMakeLists.txt do projeto ==="
          cat pacman_project/CMakeLists.txt

          echo "=== Referencias a Android e Vulkan ==="
          grep -R -n -i \
            'vulkan\|ANDROID_ABI\|android.toolchain' \
            pacman_project \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            --include='*.mk' || true

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pacman
          path: |
            pacman_project/
            out/
          if-no-files-found: ignore
          retention-days: 7
