name: Recompilar Pac-Man para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'CONTINUATION.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Corrigir diretório de logs no Android
        run: python3 tools/android/fix_android_logs.py

      - name: Instrumentar inicialização Android para logcat
        run: python3 tools/android/add_startup_diagnostics.py

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates python3-pil

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            unzip \
            zip \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxss-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxinerama-dev \
            libxfixes-dev \
            libx11-xcb-dev \
            libc++-21-dev \
            libc++abi-21-dev

      - name: Verificar ambiente
        run: |
          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Clang 21 ==="
          clang-21 --version
          clang++-21 --version

          echo "=== Verificar arquivos obrigatorios ==="
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f default.xex

          echo "default.xex encontrado."

          echo "=== Presets disponiveis ==="
          cmake --list-presets

      - name: Configurar SDK ReXGlue
        run: |
          cmake --preset linux-amd64 \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_C_FLAGS="-march=x86-64-v2" \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v2 -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++"

      - name: Compilar e instalar SDK ReXGlue
        run: |
          cmake --build \
            --preset linux-amd64-release \
            --target install

      - name: Localizar executavel ReXGlue
        run: |
          echo "=== Procurando o executavel ==="

          find out -type f -name rexglue \
            -perm /111 -print || true

          if [ -x "out/linux-amd64/Release/rexglue" ]; then
            REXGLUE_BIN="$GITHUB_WORKSPACE/out/linux-amd64/Release/rexglue"
          elif [ -x "out/linux-amd64/rexglue" ]; then
            REXGLUE_BIN="$GITHUB_WORKSPACE/out/linux-amd64/rexglue"
          else
            echo "::error::Executavel rexglue x86-64 nao encontrado em out/linux-amd64."
            echo "Arquivos encontrados:"
            find out/linux-amd64 -type f -name rexglue -print 2>/dev/null || true
            exit 1
          fi

          # Guarde a ferramenta host fora do workspace para que o CMake Android
          # nao possa sobrescreve-la ao compilar o alvo rexglue.
          REXGLUE_BIN="$RUNNER_TEMP/rexglue-host"
          cp "$GITHUB_WORKSPACE/out/linux-amd64/Release/rexglue" "$REXGLUE_BIN" 2>/dev/null || cp "$GITHUB_WORKSPACE/out/linux-amd64/rexglue" "$REXGLUE_BIN"
          chmod +x "$REXGLUE_BIN"
          echo "REXGLUE_BIN=$REXGLUE_BIN" >> "$GITHUB_ENV"

          echo "=== Versao e ajuda do ReXGlue (host x86-64) ==="
          file "$REXGLUE_BIN"
          "$REXGLUE_BIN" --help

      - name: Inicializar projeto Pac-Man
        run: |
          mkdir -p pacman_project

          "$REXGLUE_BIN" init \
            --project-name pacman_colors \
            --xex-path "$GITHUB_WORKSPACE/default.xex" \
            --game-root "$GITHUB_WORKSPACE" \
            --project-root "$GITHUB_WORKSPACE/pacman_project"

      - name: Verificar arquivos gerados
        run: |
          echo "=== Arquivos do projeto ==="
          find pacman_project -maxdepth 4 -type f -print | sort

          echo "=== Arquivos TOML ==="
          find pacman_project -type f -name '*.toml' -print

      - name: Gerar codigo do Pac-Man
        working-directory: pacman_project
        run: |
          CONFIG="$(find . -type f -name '*.toml' \
            ! -path './build*/*' -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "::error::Nenhum arquivo TOML encontrado."
            exit 1
          fi

          echo "Configuracao encontrada: $CONFIG"
          "$REXGLUE_BIN" --force codegen "$CONFIG"

      - name: Corrigir includes e identificador Android no projeto gerado
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cmake_file = Path("pacman_project/CMakeLists.txt")
          if not cmake_file.is_file():
              raise SystemExit("CMakeLists.txt do projeto gerado não foi encontrado")

          text = cmake_file.read_text()
          additions = [
              'target_include_directories(pacman_colors PRIVATE "${REXSDK_DIR}/thirdparty/imgui")',
              'target_compile_definitions(pacman_colors PRIVATE REX_ANDROID_APP_IDENTIFIER="pacman_colors")',
              'target_link_libraries(pacman_colors PRIVATE log)',
          ]
          anchor = "rexglue_setup_target(pacman_colors)"
          if anchor not in text:
              raise SystemExit("Não encontrei rexglue_setup_target(pacman_colors)")

          # Inserir as duas configurações numa única gravação, sem perder
          # alterações anteriores por reutilizar uma cópia antiga do texto.
          missing = [line for line in additions if line not in text]
          if missing:
              text = text.replace(anchor, "\n".join(missing) + "\n" + anchor, 1)
              cmake_file.write_text(text)

          print("Includes do ImGui e identificador Android verificados.")
          print(cmake_file.read_text())
          PY


      - name: Instrumentar gravação real da tabela de callbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("pacman_project/generated/default")
          marker = "DEFINE_REX_FUNC(sub_8262C828) {"
          matches = []
          for path in root.glob("pacman_colors_recomp.*.cpp"):
              source = path.read_text()
              if marker not in source:
                  continue
              prologue = marker + "\n\tREX_FUNC_PROLOGUE();"
              if source.count(prologue) != 1:
                  raise SystemExit(f"Prólogo inesperado em {path}")
              if "#include <android/log.h>" not in source:
                  lines = source.splitlines()
                  lines.insert(1, "#include <android/log.h>")
                  source = "\n".join(lines) + "\n"
              entry_diag = prologue + """
          \t__android_log_print(ANDROID_LOG_ERROR, "ReXCbWrite",
          \t    "ENTER count=%u caller_lr=0x%08X r4_target=0x%08X r5=0x%08X r6=0x%08X r7=0x%08X",
          \t    REX_LOAD_U32(0x83482808), (uint32_t)ctx.lr,
          \t    ctx.r4.u32, ctx.r5.u32, ctx.r6.u32, ctx.r7.u32);"""
              source = source.replace(prologue, entry_diag, 1)
              store_marker = "REX_STORE_U32(ctx.r9.u32 + ctx.r8.u32, ctx.r4.u32);"
              if source.count(store_marker) != 1:
                  raise SystemExit(f"Store do target inesperado em {path}")
              store_diag = """uint32_t pacman_callback_slot_address = ctx.r9.u32 + ctx.r8.u32;
          if (pacman_callback_slot_address == 0x83480CF4 || ctx.r4.u32 == 0x82738920) {
              __android_log_print(ANDROID_LOG_ERROR, "ReXCbWrite",
                  "BEFORE slot=0x%08X count=%u caller_lr=0x%08X target=0x%08X old=0x%08X arg_r5=0x%08X arg_r6=0x%08X arg_r7=0x%08X",
                  pacman_callback_slot_address, REX_LOAD_U32(0x83482808),
                  (uint32_t)ctx.lr, ctx.r4.u32, REX_LOAD_U32(pacman_callback_slot_address),
                  ctx.r5.u32, ctx.r6.u32, ctx.r7.u32);
          }
          REX_STORE_U32(ctx.r9.u32 + ctx.r8.u32, ctx.r4.u32);
          if (pacman_callback_slot_address == 0x83480CF4 || ctx.r4.u32 == 0x82738920) {
              __android_log_print(ANDROID_LOG_ERROR, "ReXCbWrite",
                  "AFTER slot=0x%08X count=%u target_now=0x%08X",
                  pacman_callback_slot_address, REX_LOAD_U32(0x83482808),
                  REX_LOAD_U32(pacman_callback_slot_address));
          }"""
              source = source.replace(store_marker, store_diag, 1)
              path.write_text(source)
              matches.append(str(path))
          if len(matches) != 1:
              raise SystemExit(f"Esperava exatamente uma definição de sub_8262C828; encontrei {matches}")
          print("Instrumentação por endereço real de destino instalada em:", matches[0])
          PY
      - name: Monitorar gravações PPC sobre o callback 53
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("pacman_project/generated/default/pacman_colors_pch.h")
          if not header.is_file():
              raise SystemExit(f"PCH gerado não encontrado: {header}")

          source = header.read_text()
          include = "#include <android/log.h>"
          if include not in source:
              source = source.replace("#include <rex/ppc.h>", "#include <rex/ppc.h>\\n" + include, 1)

          marker = "#define REX_STORE_U8(x, y)"
          if source.count(marker) != 1:
              raise SystemExit("Definição REX_STORE_U8 inesperada no PCH")

          watch = """#define REX_WATCHED_STORE(addr, width, value, store_statement)                  \\\\
            do {                                                                       \\\\
              const u32 _rex_watch_addr = (u32)(addr);                                 \\\\
              const uint64_t _rex_watch_value = (uint64_t)(value);                     \\\\
              const bool _rex_watch_hit =                                              \\\\
                  ((uint64_t)_rex_watch_addr < 0x83480CF8ull) &&                        \\\\
                  (((uint64_t)_rex_watch_addr + (width)) > 0x83480CF4ull);              \\\\
              if (_rex_watch_hit) {                                                    \\\\
                __android_log_print(ANDROID_LOG_ERROR, "ReXMemWatch",                   \\\\
                    "BEFORE addr=0x%08X width=%u value=0x%016llX lr=0x%08X slot53=0x%08X", \\\\
                    _rex_watch_addr, (unsigned)(width),                                \\\\
                    (unsigned long long)_rex_watch_value, (uint32_t)ctx.lr,             \\\\
                    REX_LOAD_U32(0x83480CF4));                                         \\\\
              }                                                                        \\\\
              store_statement;                                                        \\\\
              if (_rex_watch_hit) {                                                    \\\\
                __android_log_print(ANDROID_LOG_ERROR, "ReXMemWatch",                   \\\\
                    "AFTER addr=0x%08X width=%u value=0x%016llX lr=0x%08X slot53=0x%08X", \\\\
                    _rex_watch_addr, (unsigned)(width),                                \\\\
                    (unsigned long long)_rex_watch_value, (uint32_t)ctx.lr,             \\\\
                    REX_LOAD_U32(0x83480CF4));                                         \\\\
              }                                                                        \\\\
            } while (0)

          #define REX_STORE_U8(x, y) REX_WATCHED_STORE(                               \\\\
              x, 1, y, (*(volatile u8*)(base + _rex_watch_addr +                       \\\\
              REX_PHYS_HOST_OFFSET(_rex_watch_addr)) = (u8)_rex_watch_value))
          #define REX_STORE_U16(x, y) REX_WATCHED_STORE(                              \\\\
              x, 2, y, (*(volatile u16*)(base + _rex_watch_addr +                      \\\\
              REX_PHYS_HOST_OFFSET(_rex_watch_addr)) =                                 \\\\
              __builtin_bswap16((u16)_rex_watch_value)))
          #define REX_STORE_U32(x, y) REX_WATCHED_STORE(                              \\\\
              x, 4, y, (*(volatile u32*)(base + _rex_watch_addr +                      \\\\
              REX_PHYS_HOST_OFFSET(_rex_watch_addr)) =                                 \\\\
              __builtin_bswap32((u32)_rex_watch_value)))
          #define REX_STORE_U64(x, y) REX_WATCHED_STORE(                              \\\\
              x, 8, y, (*(volatile u64*)(base + _rex_watch_addr +                      \\\\
              REX_PHYS_HOST_OFFSET(_rex_watch_addr)) =                                 \\\\
              __builtin_bswap64((u64)_rex_watch_value)))"""

          start = source.index(marker)
          end_marker = "#define REX_MEMORY_SIZE"
          end = source.index(end_marker, start)
          source = source[:start] + watch + "\\n\\n" + source[end:]
          if "ReXMemWatch" not in source:
              raise SystemExit("Watchpoint não foi inserido")
          header.write_text(source)
          print(f"Watchpoint seletivo instalado em {header}")
          PY
      - name: Instrumentar leitura do callback 53
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("pacman_project/generated/default")
          marker = "REX_CALL_INDIRECT_FUNC(ctx.ctr.u32, 0x8262C908);"
          matches = []
          for path in root.glob("pacman_colors_recomp.*.cpp"):
              source = path.read_text()
              if marker not in source:
                  continue
              if "DEFINE_REX_FUNC(sub_8262C898) {" not in source:
                  continue
              if "#include <android/log.h>" not in source:
                  lines = source.splitlines()
                  lines.insert(1, "#include <android/log.h>")
                  source = "\n".join(lines) + "\n"
              diagnostic = """if (ctx.r31.u32 == 0x83480CF4) {
          \t__android_log_print(ANDROID_LOG_ERROR, "ReXCallback53",
          \t    "count=%u slot=0x%08X target=0x%08X arg0=0x%08X arg5=0x%08X state=%u field12=0x%08X field16=0x%08X",
          \t    REX_LOAD_U32(0x83482808), ctx.r31.u32,
          \t    REX_LOAD_U32(ctx.r31.u32), REX_LOAD_U32(ctx.r31.u32 - 4),
          \t    REX_LOAD_U32(ctx.r31.u32 + 4), REX_LOAD_U8(ctx.r31.u32 + 8),
          \t    REX_LOAD_U32(ctx.r31.u32 + 12), REX_LOAD_U32(ctx.r31.u32 + 16));
          }
          """ + marker
              if source.count(marker) != 1:
                  raise SystemExit(f"Chamada indireta inesperada em {path}")
              source = source.replace(marker, diagnostic, 1)
              path.write_text(source)
              matches.append(str(path))
          if len(matches) != 1:
              raise SystemExit(f"Esperava uma definição de sub_8262C898; encontrados: {matches}")
          print("Leitura do registro 53 instrumentada:", matches[0])
          PY

      - name: Instrumentar lista de chamadas indiretas de inicializacao
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("pacman_project/generated/default")
          marker = "DEFINE_REX_FUNC(sub_82DA24F0) {"
          call = "REX_CALL_INDIRECT_FUNC(ctx.ctr.u32, 0x82DA25A4);"
          matches = []
          for path in root.glob("pacman_colors_recomp.*.cpp"):
              source = path.read_text()
              if marker not in source:
                  continue
              prologue = marker + "\n\tREX_FUNC_PROLOGUE();"
              if source.count(prologue) != 1 or source.count(call) != 1:
                  raise SystemExit(f"Estrutura inesperada em {path}")
              if "#include <android/log.h>" not in source:
                  lines = source.splitlines()
                  lines.insert(1, "#include <android/log.h>")
                  source = "\n".join(lines) + "\n"
              diagnostic = prologue + """
          \t__android_log_print(ANDROID_LOG_ERROR, "ReXInitList",
          \t    "table=0x833A0F44 entries=%08X,%08X,%08X,%08X",
          \t    REX_LOAD_U32(0x833A0F44), REX_LOAD_U32(0x833A0F48),
          \t    REX_LOAD_U32(0x833A0F4C), REX_LOAD_U32(0x833A0F50));"""
              source = source.replace(prologue, diagnostic, 1)
              call_diag = call + """
          if (REX_LOAD_U32(0x83482808) == 54) {
          \t__android_log_print(ANDROID_LOG_ERROR, "ReXSlot53",
          \t    "WRITER init_list_slot=0x%08X init_target=0x%08X count=54",
          \t    ctx.r31.u32, ctx.ctr.u32);
          }
          """
              source = source.replace(call, call_diag, 1)
              path.write_text(source)
              matches.append(str(path))
          if len(matches) != 1:
              raise SystemExit(f"Esperava uma definição de sub_82DA24F0; encontrados: {matches}")
          print("Lista de chamadas indiretas instrumentada:", matches[0])
          PY

      - name: Verificar Android NDK
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "::error::ANDROID_NDK_LATEST_HOME nao esta definido."
            exit 1
          fi

          test -f \
            "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

          echo "Android NDK encontrado."

      - name: Verificar configuracao Android do projeto
        run: |
          if [ ! -f pacman_project/CMakeLists.txt ]; then
            echo "::error::CMakeLists.txt do projeto nao encontrado."
            exit 1
          fi

          echo "=== CMakeLists.txt do projeto ==="
          cat pacman_project/CMakeLists.txt

          echo "=== Referencias a Android e Vulkan ==="
          grep -R -n -i \
            'vulkan\|ANDROID_ABI\|android.toolchain' \
            pacman_project \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            --include='*.mk' || true

      - name: Compilar codigo gerado para Android (ARM64)
        working-directory: pacman_project
        run: |
          echo "=== Configurando o projeto com Android NDK ==="
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXSDK_DIR="$GITHUB_WORKSPACE"

          echo "=== Ajustando somente o comando de codegen ==="
          # Nao altere generated/rexglue.cmake: ele tambem define onde o alvo
          # rexglue e compilado. Altere apenas a receita que EXECUTA o codegen.
          python3 - <<'PY'
          import os
          from pathlib import Path

          host = os.environ["REXGLUE_BIN"]
          candidates = [
              Path("build-android/CMakeFiles/pacman_colors_codegen.dir/build.make"),
              Path("build-android/generated/default/CMakeFiles/pacman_colors_codegen.dir/build.make"),
          ]
          found = False
          for path in candidates:
              if not path.is_file():
                  continue
              text = path.read_text()
              original = text
              for old in (
                  os.environ["GITHUB_WORKSPACE"] + "/out/linux-arm64/rexglue",
                  os.environ["GITHUB_WORKSPACE"] + "/out/linux-amd64/Release/rexglue",
                  os.environ["GITHUB_WORKSPACE"] + "/out/linux-amd64/rexglue",
              ):
                  text = text.replace(old, host)
              if text != original:
                  path.write_text(text)
                  print(f"Codegen atualizado em: {path}")
                  found = True
          if not found:
              print("Nenhuma referencia foi substituida nos caminhos conhecidos; procurando receitas...")
              for path in Path("build-android").rglob("build.make"):
                  text = path.read_text(errors="ignore")
                  if "pacman_colors_codegen" in str(path):
                      print(f"Receita encontrada: {path}")
                      print("\\n".join(line for line in text.splitlines() if "rexglue" in line))
          PY

          CODEGEN_MAKE="build-android/CMakeFiles/pacman_colors_codegen.dir/build.make"
          if [ -f "$CODEGEN_MAKE" ]; then
            grep -n -F "$REXGLUE_BIN" "$CODEGEN_MAKE" || true
          fi

          echo "=== Compilando biblioteca Android ==="
          cmake --build build-android --config Release

      - name: Configurar Java 17 para Gradle Android
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Empacotar APK Android com SDL3
        if: success()
        working-directory: pacman_project
        run: |
          set -euo pipefail
          # SDL 3.5.0 is the development version used by the ReXGlue native runtime;
          # there is no upstream release-3.5.0 branch/tag. Pin the source to main and
          # validate its declared version before building the Android Java/native pair.
          git clone https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" checkout --detach 8bf3b7215ad9fc3deb583c6a3a37c6c67f2e24e4
          echo "=== Versão SDL selecionada ==="
          git -C "$RUNNER_TEMP/SDL" log -1 --format='%H %s'
          grep -m1 -E '^project\(SDL3 LANGUAGES C VERSION' "$RUNNER_TEMP/SDL/CMakeLists.txt" || true
          if ! grep -Eq 'VERSION[[:space:]]+"?3\.5\.0"?([[:space:]]|\))' "$RUNNER_TEMP/SDL/CMakeLists.txt"; then
            echo "::error::A fonte SDL baixada não declara a versão 3.5.0 esperada pela biblioteca nativa ReXGlue."
            exit 1
          fi
          mkdir -p android-package
          cp -a "$RUNNER_TEMP/SDL/android-project/." android-package/
          # O SDL é fixado no mesmo commit do submódulo usado pelo ReXGlue.
          # Isso mantém as assinaturas JNI Java compatíveis com librexruntime.so.
          # Substituir o ícone padrão do SDL por um ícone próprio do Pac-Man.
          # Gerar PNGs nos tamanhos de cada densidade Android usando Pillow.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          res = Path("android-package/app/src/main/res")
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
                   "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          found = False
          for folder, size in sizes.items():
              directory = res / folder
              if not directory.is_dir():
                  continue
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  path = directory / name
                  if not path.exists():
                      continue
                  image = Image.new("RGBA", (size, size), (16, 24, 40, 255))
                  draw = ImageDraw.Draw(image)
                  margin = size * 0.10
                  box = (margin, margin, size - margin, size - margin)
                  draw.ellipse(box, fill=(255, 214, 10, 255))
                  # Boca triangular preta, estilo clássico do Pac-Man.
                  cx, cy = size * 0.52, size * 0.50
                  radius = size * 0.40
                  points = [(cx, cy),
                            (cx + radius * math.cos(math.radians(-28)),
                             cy + radius * math.sin(math.radians(-28))),
                            (cx + radius * math.cos(math.radians(28)),
                             cy + radius * math.sin(math.radians(28)))]
                  draw.polygon(points, fill=(16, 24, 40, 255))
                  image.save(path)
                  print(f"Ícone Pac-Man gerado: {path} ({size}x{size})")
                  found = True
          if not found:
              raise SystemExit("Não encontrei ic_launcher.png nas pastas mipmap do projeto SDL")
          PY
          # O projeto Android do SDL deve compilar a biblioteca compartilhada libSDL3.so,
          # que a Activity carrega com System.loadLibrary("SDL3"). Não desabilite
          # externalNativeBuild: isso deixava o APK sem libSDL3.so.
          mkdir -p android-package/app/jni
          cp -a "$RUNNER_TEMP/SDL" android-package/app/jni/SDL

      - name: Instalar seletor SAF e preparação privada dos arquivos
        if: success()
        working-directory: pacman_project
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/android/install_game_setup.py" android-package
          if find android-package/app/src/main/assets -type f -iname "*.xex" -print -quit 2>/dev/null | grep -q .; then
            echo "::error::O APK não pode conter arquivos XEX em assets."
            exit 1
          fi
          echo "Seletor SAF instalado; nenhum XEX foi copiado para assets."

      - name: Compatibilidade JNI HID do SDL com ReXGlue
        if: success()
        working-directory: pacman_project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java = Path("android-package/app/src/main/java/org/libsdl/app/HIDDeviceManager.java")
          text = java.read_text()
          legacy = "native void HIDDeviceConnected(int deviceID, String identifier, int vendorId, int productId, String serial_number, int release_number, String manufacturer_string, String product_string, int interface_number, int interface_class, int interface_subclass, int interface_protocol, boolean bBluetooth);"
          if legacy not in text:
              raise SystemExit("O SDL fixado não contém a assinatura HID esperada pelo ReXGlue.")
          print("Assinaturas JNI verificadas contra o commit SDL fixado.")
          PY

          MAIN_LIB="$(find "$GITHUB_WORKSPACE/pacman_project/build-android" "$GITHUB_WORKSPACE/out/linux-arm64" -type f -name 'libmain.so' -print -quit 2>/dev/null || true)"
          if [ -z "$MAIN_LIB" ]; then
            echo "::error::A biblioteca libmain.so do Pac-Man não foi gerada."
            find build-android -type f -name '*.so' -print || true
            exit 1
          fi

          # Deixe o Gradle/NDK compilar SDL3 e o alvo de exemplo para produzir
          # libSDL3.so; depois substitua somente libmain.so dentro do APK pelo
          # binário recompilado do ReXGlue.
          sed -i 's/android:label="@string\/app_name"/android:label="Pac-Man Recompiled"/' android-package/app/src/main/AndroidManifest.xml
          cd android-package
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p ../dist/android-apk

          mkdir -p "$RUNNER_TEMP/apk-replace/lib/arm64-v8a"
          cp "$MAIN_LIB" "$RUNNER_TEMP/apk-replace/lib/arm64-v8a/libmain.so"

          # libmain.so links against the ReXGlue runtime and Xenos GPU plugin.
          # Bundle both ARM64 shared libraries beside libmain.so so Android's
          # linker can resolve their DT_NEEDED entries at application startup.
          for LIB in librexruntime.so librexgpu-xenos.so; do
            SOURCE="$GITHUB_WORKSPACE/out/linux-arm64/$LIB"
            if [ ! -s "$SOURCE" ]; then
              echo "::error::Required Android library not found: $SOURCE"
              find "$GITHUB_WORKSPACE/out" -type f -name "$LIB" -print || true
              exit 1
            fi
            cp "$SOURCE" "$RUNNER_TEMP/apk-replace/lib/arm64-v8a/$LIB"
          done

          (cd "$RUNNER_TEMP/apk-replace" && zip -q -u "$GITHUB_WORKSPACE/pacman_project/android-package/$APK" lib/arm64-v8a/libmain.so lib/arm64-v8a/librexruntime.so lib/arm64-v8a/librexgpu-xenos.so)

          # Reassinar o APK depois de alterar a biblioteca nativa.
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/pacman-aligned.apk"
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BUILD_TOOLS_DIR/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out ../dist/android-apk/pacman-android-arm64-debug.apk "$RUNNER_TEMP/pacman-aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose ../dist/android-apk/pacman-android-arm64-debug.apk
          echo "APK criado:"
          ls -lh ../dist/android-apk/pacman-android-arm64-debug.apk
          echo "Bibliotecas ARM64 incluídas:"
          unzip -l ../dist/android-apk/pacman-android-arm64-debug.apk | grep -E 'lib/arm64-v8a/lib(main|SDL3|rexruntime|rexgpu-xenos)\.so'
          for LIB in libSDL3.so libmain.so librexruntime.so librexgpu-xenos.so; do
            unzip -l ../dist/android-apk/pacman-android-arm64-debug.apk | grep -q "lib/arm64-v8a/$LIB" || { echo "::error::$LIB não foi incluída no APK."; exit 1; }
          done

      - name: Preparar diagnosticos compactos
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnosticos
          echo "Run: $GITHUB_RUN_ID" > diagnosticos/resumo.txt
          echo "Commit: $GITHUB_SHA" >> diagnosticos/resumo.txt
          GENERATED="pacman_project/generated/default"
          if [ -d "$GENERATED" ]; then
            echo "=== Busca global do trap ===" >> diagnosticos/resumo.txt
            grep -R -n -E 'sub_8262C898|82738920|8262C898' "$GENERATED" \
              --include='*.cpp' --include='*.h' \
              > diagnosticos/enderecos-trap.txt || true
            echo "=== Contexto do chamador do callback (LR 0x82DA25A8) ===" >> diagnosticos/resumo.txt
            grep -R -n -C 12 -E "82DA25A8" "$GENERATED" \
              --include="*.cpp" --include="*.h" \
              > diagnosticos/caller-callback.txt || true
            echo "=== Arquivos gerados e tamanhos ===" >> diagnosticos/resumo.txt
            find "$GENERATED" -maxdepth 1 -type f \
              \( -name '*.cpp' -o -name '*.h' \) \
              -printf '%f %s bytes\\n' | sort >> diagnosticos/resumo.txt
            # Preserve only shards that contain the caller/target, plus the
            # generated init/register mapping sources needed to inspect dispatch.
            while IFS= read -r SOURCE; do
              [ -f "$SOURCE" ] || continue
              BASE="$(basename "$SOURCE")"
              cp "$SOURCE" "diagnosticos/$BASE"
            done < <(grep -R -l -E 'sub_8262C898|82738920|8262C898|82DA25A8' "$GENERATED" \
              --include='*.cpp' --include='*.h' || true)
            for SOURCE in "$GENERATED"/*init*.cpp "$GENERATED"/*register*.cpp \
                          "$GENERATED"/*init*.h "$GENERATED"/*register*.h; do
              [ -f "$SOURCE" ] || continue
              cp "$SOURCE" "diagnosticos/$(basename "$SOURCE")"
            done
          fi
          for file in \
            pacman_project/CMakeLists.txt \
            pacman_project/build-android/CMakeCache.txt \
            pacman_project/build-android/CMakeFiles/pacman_colors_recomp.dir/build.make; do
            if [ -f "$file" ]; then
              cp --parents "$file" diagnosticos/
            fi
          done
          find diagnosticos -type f -printf '%p %s bytes\\n' >> diagnosticos/resumo.txt

      - name: Salvar diagnosticos compactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pacman
          path: diagnosticos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar APK Android
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pacman-android-apk
          path: pacman_project/dist/android-apk/pacman-android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
